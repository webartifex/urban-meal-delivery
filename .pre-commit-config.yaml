default_stages: [pre-commit]  # only used if a hook does not specify stages
fail_fast: true
repos:
# Run the local formatting, linting, and testing tool chains.
- repo: local
  hooks:
  - id: local-format
    name: Format the source files
    entry: uv run nox -s format --
    language: system
    stages: [pre-commit]
    types: [python]
  - id: local-lint
    name: Lint the source files
    entry: uv run nox -s lint --
    language: system
    stages: [pre-commit]
    types: [python]
  - id: local-test-suite
    name: Run the entire test suite
    entry: poetry run nox -s test-suite --
    language: system
    stages: [pre-merge-commit]
    types: [text]
# Enable hooks provided by the pre-commit project to
# enforce rules that local tools could not that easily.
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
    args: [--maxkb=100]
  - id: check-case-conflict
  - id: check-builtin-literals
  - id: check-merge-conflict
  - id: check-toml
  - id: check-yaml
  - id: end-of-file-fixer
    stages: [pre-commit]  # overwrite the default
  - id: mixed-line-ending
    args: [--fix=no]
  - id: no-commit-to-branch
    args: [--branch, main]
  - id: trailing-whitespace
    stages: [pre-commit]  # overwrite the default
