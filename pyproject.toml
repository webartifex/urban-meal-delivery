[build-system]

build-backend = "uv_build"

requires = ["uv_build (>=0.13.10,<0.14.0)"]  # Same range as in "[tool.uv]" below



[project]

name = "velofy"
version = "0.5.0.dev0"

authors = [{ name = "Alexander Hess", email = "alexander@webartifex.de" }]

description = "Optimizing an urban meal delivery platform"

keywords = [
    "data-science",
    "meal-delivery",
    "vehicle-routing-problem",
]

license = "MIT"

readme = "README.md"

classifiers = [
    # All `SUPPORTED_PYTHONS` listed here are automatically
    # loaded by `nox`, our task runner, and made available
    # for testing in isolated environments
    "Programming Language :: Python :: 3.13",
]

requires-python = ">=3.13,<4.0"


# Package => Code developed in *.py files and packaged under src/velofy
dependencies = [
    "Shapely (>=2.2.0,<3.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "click (>=8.5.1,<9.0.0)",
    "folium (>=1.0.0,<2.0.0)",
    "geopy (>=2.5.0,<3.0.0)",
    "googlemaps (>=4.10.0,<5.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "ordered-set (>=4.1.0,<5.0.0)",
    "pandas (>=3.1.1,<4.0.0)",
    "psycopg[binary] (>=3.3.9,<4.0.0)",  # Adapter for PostgreSQL
    "rpy2 (>=3.6.9,<4.0.0)",
    "sqlalchemy (>=2.1.9,<3.0.0)",
    "statsmodels (>=0.15.0,<0.16.0)",
    "utm (>=0.9.0,<0.10.0)",
]


[project.optional-dependencies]

# `jupyter lab` => Notebooks with analyses using the developed package
research = [
    "jupyterlab (>=4.6.6,<5.0.0)",
    "numpy (>=2.5.5,<3.0.0)",
    "pytz (>=2026.6)",
]


[project.scripts]

manage = "velofy.console:cli"


[project.urls]

homepage = "https://code.webartifex.de/alexander/velofy"
repository = "https://code.webartifex.de/alexander/velofy"



[dependency-groups]

dev = [
    # Task Runners
    "nox (>=2026.10.20)",
    "pre-commit (>=4.7.0,<5.0.0)",

    # Code Formatters
    "autoflake (>=2.4.0,<3.0.0)",
    "black (>=25.12.0,<26.0.0)",
    "isort (>=9.0.2,<10.0.0)",

    # Code Analyzers
    "flake8 (>=7.5.0,<8.0.0)",
    "flake8-annotations (>=3.3.1,<4.0.0)",
    "flake8-bandit (>=4.1.1,<5.0.0)",
    "flake8-black (>=0.5.0,<0.6.0)",
    "flake8-broken-line (>=1.0.0,<2.0.0)",
    "flake8-bugbear (>=26.11.22,<27.0.0)",
    "flake8-commas (>=4.0.0,<5.0.0)",
    "flake8-comprehensions (>=3.17.0,<4.0.0)",
    "flake8-debugger (>=4.1.2,<5.0.0)",
    "flake8-docstrings (>=1.7.0,<2.0.0)",
    "flake8-pyproject (>=1.2.4,<2.0.0)",
    "flake8-pytest-style (>=2.2.0,<3.0.0)",
    "flake8-quotes (>=3.4.0,<4.0.0)",
    "mypy (>=2.4.1,<3.0.0)",
]

test = [
    "factory-boy (>=3.3.3,<4.0.0)",
    "Faker (>=40.63.0,<41.0.0)",
    "packaging (>=26.4)",  # Used to test the packaged version
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-env (>=1.8.8,<2.0.0)",
    "pytest-mock (>=3.17.0,<4.0.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "xdoctest[colors] (>=1.3.2,<2.0.0)",
]

docs = [
    "sphinx (>=9.2.0,<10.0.0)",
    "sphinx-autodoc-typehints (>=3.17.7,<4.0.0)",
]



[tool.autoflake]
# Source: https://github.com/PyCQA/autoflake#configuration

in-place = true
recursive = true
expand-star-imports = true
remove-all-unused-imports = true
ignore-init-module-imports = true  # modifies "remove-all-unused-imports"
remove-duplicate-keys = true
remove-unused-variables = true



[tool.black]

target-version = ["py313"]

line-length = 88



[tool.coverage]
# Source: https://coverage.readthedocs.io/en/latest/config.html


[tool.coverage.paths]

source = [
    "src/",
    "*/site-packages/",
]


[tool.coverage.report]

show_missing = true

skip_covered = true
skip_empty = true


[tool.coverage.run]

branch = true

data_file = ".cache/coverage/data"

source = ["velofy"]



[tool.flake8]
# Source: https://flake8.pycqa.org/en/latest/user/configuration.html

# Include error classes only explicitly
# to avoid forward compatibility issues.
select = [
    # =============
    # flake8's base
    # =============
    # mccabe => cyclomatic complexity
    "C901",
    # pycodestyle => PEP8 compliance
    "E", "W",
    # pyflakes => basic errors
    "F4", "F5", "F6", "F7", "F8", "F9",
    # ========================
    # wemake-python-styleguide
    # Source: https://wemake-python-stylegui.de/en/latest/pages/usage/violations/index.html
    # ========================
    # darglint => docstring matches implementation
    "DAR0", "DAR1", "DAR2", "DAR3", "DAR4", "DAR5",
    # flake8-bandit => common security issues
    "S1", "S2", "S3", "S4", "S5", "S6", "S7",
    # flake8-broken-line => no \ to end a line
    "N400",
    # flake8-bugbear => opinionated bugs and design flaws
    "B0", "B3", "B9",
    # flake8-commas => better comma placements
    "C8",
    # flake8-comprehensions => better comprehensions
    "C4",
    # flake8-debugger => no debugger usage
    "T100",
    # flake8-docstrings => PEP257 compliance
    "D1", "D2", "D3", "D4",
    # flake8-quotes => use double quotes everywhere (complying with black)
    "Q0",
    # pep8-naming
    "N8",
    # =====
    # other
    # =====
    # flake8-annotations => enforce type checking for functions
    "ANN0", "ANN2", "ANN3",
    # flake8-black => complain if black would make changes
    "BLK1", "BLK9",
    # flake8-pytest-style => enforce a consistent style with pytest
    "PT0",
]

# By default, flake8 ignores some errors.
# Instead, do not ignore anything.
ignore = []

# If --ignore is passed on the command
# line, still ignore the following:
extend-ignore = [
    # Too long line => duplicate with E501.
    "B950",
    # Comply with black's style.
    # Source: https://github.com/psf/black/blob/master/docs/compatible_configs.md#flake8
    "E203", "W503",
    # Let's not do `@pytest.mark.no_cover()` instead of `@pytest.mark.no_cover`.
    "PT023",
]

per-file-ignores = [
    # Top-levels of a sub-packages are intended to import a lot.
    "**/__init__.py:F401",
    # Type annotations are not strictly enforced.
    "migrations/env.py:ANN0,ANN2",
    # - ANN0, ANN2 => Type annotations are not strictly enforced.
    # - S608 => Do not worry about SQL injection here.
    "migrations/versions/*.py:ANN0,ANN2,S608",
    # Type annotations are not strictly enforced.
    "noxfile.py:ANN0,ANN2",
    # - ANN0, ANN2 => Type annotations are not strictly enforced.
    # - D106 => The `Meta` class inside the factory_boy models do not need a docstring.
    # - S101 => `assert` statements are ok in the test suite.
    # - S311 => The `random` module is not used for cryptography.
    "tests/*.py:ANN0,ANN2,D106,S101,S311",
]

# Explicitly set mccabe's maximum complexity to 10 as recommended by
# Thomas McCabe, the inventor of the McCabe complexity, and the NIST.
# Source: https://en.wikipedia.org/wiki/Cyclomatic_complexity#Limiting_complexity_during_development
max-complexity = 10

# Comply with black's style.
# Source: https://github.com/psf/black/blob/master/docs/the_black_code_style.md#line-length
max-line-length = 88

# Preview the code lines that cause errors.
show-source = true

# darglint
strictness = "long"
# flake8-docstrings
docstring-convention = "google"
# flake8-quotes
# Source: https://github.com/zheller/flake8-quotes#configuration
avoid-escape = true
docstring-quotes = "double"
inline-quotes = "double"
multiline-quotes = "double"

# ==============================
# flake8-pytest-style's settings
# ==============================
# Prefer @pytest.fixture over @pytest.fixture().
pytest-fixture-no-parentheses = true
# Prefer @pytest.mark.parametrize(['param1', 'param2'], [(1, 2), (3, 4)])
# over @pytest.mark.parametrize(('param1', 'param2'), ([1, 2], [3, 4]))
pytest-parametrize-names-type = "list"
pytest-parametrize-values-row-type = "tuple"
pytest-parametrize-values-type = "list"



[tool.isort]
# Source: https://pycqa.github.io/isort/docs/configuration/options.html

atomic = true
case_sensitive = true
combine_star = true
force_alphabetical_sort_within_sections = true
lines_after_imports = 2
remove_redundant_aliases = true

# Comply with black's style
# Source: https://github.com/psf/black/blob/master/docs/compatible_configs.md#isort
ensure_newline_before_comments = true
force_grid_wrap = 0
include_trailing_comma = true
line_length = 88
multi_line_output = 3
use_parentheses = true

# Comply with Google's Python Style Guide
# => All imports go on a single line except the ones from the typing module
# Source: https://google.github.io/styleguide/pyguide.html#313-imports-formatting
force_single_line = true
single_line_exclusions = ["typing"]



[tool.mypy]
# Source: https://mypy.readthedocs.io/en/stable/config_file.html

cache_dir = ".cache/mypy"

# Check the interior of functions without type annotations
check_untyped_defs = true

# Disallow generic types without explicit type parameters
disallow_any_generics = true

# Disallow functions with incomplete type annotations
disallow_incomplete_defs = true

# Disallow calling functions without type annotations
disallow_untyped_calls = true

# Disallow functions without type annotations (or incomplete annotations)
disallow_untyped_defs = true


[[tool.mypy.overrides]]

module = [
    "folium.*",
    "geopy.*",
    "googlemaps.*",
    "matplotlib.*",
    "nox.*",
    "numpy.*",
    "ordered_set.*",
    "packaging",
    "pandas",
    "pytest",
    "rpy2.*",
    "sqlalchemy.*",
    "statsmodels.*",
    "utm.*",
]

ignore_missing_imports = true



[tool.pytest.ini_options]
# Source: https://docs.pytest.org/en/stable/reference/reference.html#ini-options-ref

cache_dir = ".cache/pytest"

testpaths = ["tests"]

# "-ra" => Summarize skipped and `xfailed tests at the end
addopts = "-ra --strict-config --strict-markers"

console_output_style = "count"

xfail_strict = true

required_plugins = [
    "pytest-cov",
    "pytest-env",
    "pytest-mock",
]

env = [
    "TESTING=true",
]

filterwarnings = [
    "ignore:::patsy.*",
]

markers = [
    "db: (integration) tests touching the database",
    "e2e: non-db and non-r integration tests",
    "r: (integration) tests using rpy2",
]



[tool.uv]
# Source: https://docs.astral.sh/uv/reference/settings/

required-version = ">=0.13.10,<0.14.0"  # Same range as "uv_build" above

# `uv sync` installs all [dependency-groups] into the local develop environment
# whereas the `nox` sessions install only the groups they need
default-groups = "all"

# Rebuild the package when its source files change;
# by default, `uv` only watches the pyproject.toml file
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.py" },
]
