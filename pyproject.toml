[build-system]

build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=2.0.0,<3.0.0"]



[project]

name = "velofy"
version = "0.5.0.dev0"

authors = [{ name = "Alexander Hess", email = "alexander@webartifex.de" }]

description = "Optimizing an urban meal delivery platform"

keywords = [
    "data-science",
    "meal-delivery",
    "vehicle-routing-problem",
]

license = "MIT"

readme = "README.md"

requires-python = ">=3.13,<4.0"


# Package => Code developed in *.py files and packaged under src/velofy
dependencies = [
    "Shapely>=2.2.0,<3",
    "alembic>=1.20.1,<2",
    "click>=8.5.1,<9",
    "folium>=1.0.0,<2",
    "geopy>=2.5.0,<3",
    "googlemaps>=4.10.0,<5",
    "matplotlib>=3.11.2,<4",
    "ordered-set>=4.1.0,<5",
    "pandas>=3.1.1,<4",
    "psycopg[binary]>=3.3.9,<4",  # Adapter for PostgreSQL
    "rpy2>=3.6.9,<4",
    "sqlalchemy>=2.1.9,<3",
    "statsmodels>=0.15.0,<0.16",
    "utm>=0.9.0,<0.10",
]


[project.optional-dependencies]

# `jupyter lab` => Notebooks with analyses using the developed package
research = [
    "jupyterlab>=4.6.6,<5",
    "numpy>=2.5.5,<3",
    "pytz>=2026.6",
]


[project.scripts]

manage = "velofy.console:cli"


[project.urls]

homepage = "https://code.webartifex.de/alexander/velofy"
repository = "https://code.webartifex.de/alexander/velofy"



[tool.black]

target-version = ["py313"]

line-length = 88

skip-string-normalization = true  # `wemake-python-styleguide` enforces single quotes



[tool.coverage]
# Source: https://coverage.readthedocs.io/en/latest/config.html


[tool.coverage.paths]

source = [
    "src/",
    "*/site-packages/",
]


[tool.coverage.report]

show_missing = true

skip_covered = true
skip_empty = true


[tool.coverage.run]

branch = true

data_file = ".cache/coverage/data"

source = ["velofy"]



[tool.mypy]
# Source: https://mypy.readthedocs.io/en/stable/config_file.html

cache_dir = ".cache/mypy"

# Check the interior of functions without type annotations
check_untyped_defs = true

# Disallow generic types without explicit type parameters
disallow_any_generics = true

# Disallow functions with incomplete type annotations
disallow_incomplete_defs = true

# Disallow calling functions without type annotations
disallow_untyped_calls = true

# Disallow functions without type annotations (or incomplete annotations)
disallow_untyped_defs = true


[[tool.mypy.overrides]]

module = [
    "folium.*",
    "geopy.*",
    "googlemaps.*",
    "matplotlib.*",
    "nox.*",
    "numpy.*",
    "ordered_set.*",
    "packaging",
    "pandas",
    "pytest",
    "rpy2.*",
    "sqlalchemy.*",
    "statsmodels.*",
    "utm.*",
]

ignore_missing_imports = true



[tool.poetry.group.dev.dependencies]

# Task Runners
nox = ">=2026.10.20"
pre-commit = ">=4.7.0,<5"

# Code Formatters
autoflake = ">=2.4.0,<3"
black = ">=25.12.0,<26"
isort = ">=9.0.2,<10"

# Code Analyzers
flake8 = ">=7.5.0,<8"
flake8-annotations = ">=3.3.1,<4"
flake8-black = ">=0.5.0,<0.6"
flake8-pytest-style = ">=2.2.0,<3"
mypy = ">=2.4.1,<3"

# Test Suite
Faker = ">=40.63.0,<41"
factory-boy = ">=3.3.3,<4"
packaging = ">=26.4"  # Used to test the packaged version
pytest = ">=9.2.0,<10"
pytest-cov = ">=7.1.0,<8"
pytest-env = ">=1.8.8,<2"
pytest-mock = ">=3.17.0,<4"
xdoctest = { version=">=1.3.2,<2", extras=["optional"] }

# Documentation
sphinx = ">=9.2.0,<10"
sphinx-autodoc-typehints = ">=3.17.7,<4"



[tool.pytest.ini_options]
# Source: https://docs.pytest.org/en/stable/reference/reference.html#ini-options-ref

cache_dir = ".cache/pytest"

addopts = "--strict-markers"

console_output_style = "count"

env = [
    "TESTING=true",
]

filterwarnings = [
    "ignore:::patsy.*",
]

markers = [
    "db: (integration) tests touching the database",
    "e2e: non-db and non-r integration tests",
    "r: (integration) tests using rpy2",
]
