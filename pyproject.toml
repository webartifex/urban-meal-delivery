[build-system]

build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=2.0.0,<3.0.0"]



[project]

name = "velofy"
version = "0.5.0.dev0"

authors = [{ name = "Alexander Hess", email = "alexander@webartifex.de" }]

description = "Optimizing an urban meal delivery platform"

keywords = [
    "data-science",
    "meal-delivery",
    "vehicle-routing-problem",
]

license = "MIT"

readme = "README.md"

requires-python = ">=3.13,<4.0"


# Package => Code developed in *.py files and packaged under src/velofy
dependencies = [
    "Shapely>=1.7.1,<2.1",
    "alembic>=1.4.2",
    "click>=7.1.2",
    "folium>=0.12.1,<0.19",
    "geopy>=2.1.0,<3",
    "googlemaps>=4.4.2,<5",
    "matplotlib>=3.3.3,<3.10",
    "ordered-set>=4.0.2,<5",
    "pandas>=1.1.0,<2.3",
    "psycopg2>=2.8.5,<3",  # Adapter for PostgreSQL
    "rpy2>=3.4.1,<4",
    "sqlalchemy>=1.3.18,<2.1",
    "statsmodels>=0.12.1,<0.15",
    "utm>=0.7.0,<0.9",
]


[project.optional-dependencies]

# `jupyter lab` => Notebooks with analyses using the developed package
research = [
    "jupyterlab>=2.2.2",
    "numpy>=1.19.1,<2.2",
    "pytz>=2020.1",
]


[project.scripts]

manage = "velofy.console:cli"


[project.urls]

homepage = "https://code.webartifex.de/alexander/velofy"
repository = "https://code.webartifex.de/alexander/velofy"



[tool.black]

target-version = ["py313"]

line-length = 88

skip-string-normalization = true  # `wemake-python-styleguide` enforces single quotes



[tool.poetry.group.dev.dependencies]

# Task Runners
nox = ">=2020.5.24"
pre-commit = ">=2.6.0,<3.6"

# Code Formatters
autoflake = ">=1.3.1,<2"
black = ">=19.10b0,<26"
isort = ">=4.3.21,<6"

# Code Analyzers
flake8 = ">=3.8.3,<5"
flake8-annotations = ">=2.3.0,<3"
flake8-black = ">=0.2.1"
flake8-pytest-style = ">=1.2.2,<2"
mypy = ">=0.782,<1.15"

# Test Suite
Faker = ">=5.0.1"
factory-boy = ">=3.1.0,<3.4"
geopy = "^2.1.0"
packaging = ">=20.4"  # Used to test the packaged version
pytest = ">=6.0.1,<9"
pytest-cov = ">=2.10.0,<6"
pytest-env = ">=0.6.2,<1.2"
pytest-mock = ">=3.5.1,<3.15"
xdoctest = { version=">=0.13.0", extras=["optional"] }

# Documentation
sphinx = ">=3.1.2,<7.2"
sphinx-autodoc-typehints = ">=1.11.0,<2.1"
